<!DOCTYPE html>

<head>

* {

body {

/* HEADER */

.signup-section {

    display: flex;

/* SIGN UP BOX */

.signup-box {
    width: 400px;
    padding: 35px 40px;

    background: white;

}


/* TITLE */

.signup-box h1 {
    text-align: center;
    color: #22174C;
    margin-bottom: 10px;
}

.signup-box > p {
    text-align: center;
    color: #777;
    margin-bottom: 22px;
}


/* FORM */

label {
    display: block;
    color: #333;
    margin-bottom: 7px;
}

input {
    width: 100%;

    font-size: 15px;

    cursor: pointer;
}

button:hover {
    background: #e0b400;
}


/* LOGIN */

.login-text {

}

.login-text a {
    color: #22174C;

    margin-top: 15px;

}


    </style>
</head>

<body>

    
    <header>

        <div class="logo">Sophie</div>

        <nav>
            <a href="index.html#home">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#services">Services</a>

    <!-- SIGN UP -->
    <section class="signup-section">

        <div class="signup-box">

            <h1>Create Account</h1>

            <p>Sign up to get started</p>

            <form id="signupForm">

                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">CREATE ACCOUNT</button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="./Login.html">Login</a>

    <script type="module" src="signup.js">
        import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
} from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDQ-_11c9AaW5-qwXHxwOl1vNuBe7V0RJc",
    authDomain: "website-453a6.firebaseapp.com",
    projectId: "website-453a6",
    storageBucket: "website-453a6.firebasestorage.app",
    messagingSenderId: "405430677930",
    appId: "1:405430677930:web:4b5b65769aa280c4857bd3",
    measurementId: "G-J5Z98YJTNL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const signupForm = document.getElementById("signupForm");
const message = document.getElementById("message");

signupForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.color = "red";
        return;
    }

    try {

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        console.log("Account created:", userCredential.user);

        message.textContent =
            "Account created successfully!";

        message.style.color = "green";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {

        console.log(error);

        if (error.code === "auth/email-already-in-use") {

            message.textContent =
                "This email is already registered.";

        } else if (error.code === "auth/weak-password") {

            message.textContent =
                "Password must be at least 6 characters.";

        } else {

            message.textContent =
                "Something went wrong. Try again.";
        }

        message.style.color = "red";
    }
});


    </script>
