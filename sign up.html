        import { initializeApp } from

import {
    getAuth,
    createUserWithEmailAndPassword
} from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDQ-_11c9AaW5-qwXHxwOl1vNuBe7V0RJc",
    authDomain: "website-453a6.firebaseapp.com",
    projectId: "website-453a6",
    storageBucket: "website-453a6.firebasestorage.app",
    messagingSenderId: "405430677930",
    appId: "1:405430677930:web:4b5b65769aa280c4857bd3",
    measurementId: "G-J5Z98YJTNL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const signupForm = document.getElementById("signupForm");
const message = document.getElementById("message");

signupForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.color = "red";
        return;
    }

    try {

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        console.log("Account created:", userCredential.user);

        message.textContent =
            "Account created successfully!";

        message.style.color = "green";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {

        console.log(error);

        if (error.code === "auth/email-already-in-use") {

            message.textContent =
                "This email is already registered.";

        } else if (error.code === "auth/weak-password") {

            message.textContent =
                "Password must be at least 6 characters.";

        } else {

            message.textContent =
                "Something went wrong. Try again.";
        }

        message.style.color = "red";
    }
});
