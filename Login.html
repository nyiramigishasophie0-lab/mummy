
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sophie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #22174C;
            --secondary: #f5c518;
            --white: #ffffff;
            --text: #333333;
            --muted: #777777;
            --border: #dddddd;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: var(--primary);
        }

        .logo {
            color: var(--white);
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: var(--secondary);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            background: var(--secondary);
            color: var(--primary);
        }

        .login-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            animation: appear 0.6s ease;
        }

        .login-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1edff;
            border-radius: 50%;
            overflow: hidden;
        }

        .login-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-box h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            background: var(--white);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 23, 76, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: var(--secondary);
            color: var(--primary);
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #e0b400;
            transform: translateY(-2px);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #message:empty {
            display: none;
        }

        .signup-text {
            margin-top: 25px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .signup-text a,
        .back-home {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover,
        .back-home:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--white);
            font-size: 13px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            header {
                justify-content: center;
            }
        }

        @media (max-width: 500px) {
            header {
                padding: 20px 12px;
            }

            nav a {
                font-size: 12px;
                padding: 8px;
            }

            .login-section {
                padding: 30px 15px;
            }

            .login-box {
                padding: 28px 22px;
            }

            .login-box h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="./index.html" class="logo">Sophie</a>

        <nav>
            <a href="./index.html">Home</a>
            <a href="./Abouts.html">About</a>
            <a href="./service.html">Services</a>
            <a href="./skills.html">Skills</a>
            <a href="./education.html">Education</a>
            <a href="./project.html">Projects</a>
            <a href="./Blog.html">Blog</a>
            <a href="./contacts.html">Contact</a>
            <a href="./Login.html" class="active">Login</a>
        </nav>
    </header>

    <main class="login-section">
        <div class="login-box">

            <div class="login-icon">
                <img src="./sophie.pic-removebg-preview.png"
                     alt="Sophie">
            </div>

            <h1>Welcome Back!</h1>
            <p class="subtitle">Login to your Sophie account</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit"
                        id="loginButton"
                        class="login-button">
                    LOGIN
                </button>

                <p id="message" role="status"
                   aria-live="polite"></p>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="./sign up.html">Sign Up</a>
            </p>

            <a href="./index.html" class="back-home">
                ← Back to Home
            </a>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sophie. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword
        } from
            "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDo8Mx05x298OWpQaDUAjUvYR2Ye-ELcUs",
            authDomain: "dashboard-35801.firebaseapp.com",
            projectId: "dashboard-35801",
            storageBucket: "dashboard-35801.firebasestorage.app",
            messagingSenderId: "605136367808",
            appId: "1:605136367808:web:fb1f5708c1ad8a3545bd25",
            measurementId: "G-W2W8LZLQ68"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const togglePassword = document.getElementById("togglePassword");
        const message = document.getElementById("message");

        function showMessage(text, color) {
            message.textContent = text;
            message.style.color = color;
        }

        togglePassword.addEventListener("click", () => {
            const hidden = passwordInput.type === "password";

            passwordInput.type = hidden ? "text" : "password";
            togglePassword.textContent = hidden ? "Hide" : "Show";
            togglePassword.setAttribute(
                "aria-label",
                hidden ? "Hide password" : "Show password"
            );
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            loginButton.disabled = true;
            loginButton.textContent = "LOGGING IN...";
            showMessage("Checking your account...", "#555555");

            try {
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                showMessage(
                    "Login successful! Opening dashboard...",
                    "green"
                );

                window.location.assign("./dashboard.html");

            } catch (error) {
                console.error("Firebase login error:", error.code);

                const messages = {
                    "auth/invalid-credential":
                        "Incorrect email or password.",
                    "auth/invalid-email":
                        "Please enter a valid email address.",
                    "auth/user-disabled":
                        "This account has been disabled.",
                    "auth/too-many-requests":
                        "Too many attempts. Please wait and try again.",
                    "auth/network-request-failed":
                        "Network error. Check your internet connection.",
                    "auth/operation-not-allowed":
                        "Enable Email/Password in Firebase Authentication."
                };

                showMessage(
                    messages[error.code] ||
                    "Login failed: " + error.code,
                    "red"
                );

                loginButton.disabled = false;
                loginButton.textContent = "LOGIN";
            }
        });
    </script>

</body>
</html>
