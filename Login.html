
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sophie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #22174C;
            --secondary: #f5c518;
            --white: #ffffff;
            --text: #333333;
            --muted: #777777;
            --border: #dddddd;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: var(--primary);
        }

        .logo {
            color: var(--white);
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            background: var(--secondary);
            color: var(--primary);
        }

        .login-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            animation: appear 0.6s ease;
        }

        .login-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1edff;
            border-radius: 50%;
            overflow: hidden;
        }

        .login-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            background: var(--white);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 23, 76, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: var(--secondary);
            color: var(--primary);
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #e0b400;
        }

        .login-button:disabled,
        .google-button:disabled,
        .forgot-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .forgot-button {
            display: block;
            margin: 15px 0 20px auto;
            border: none;
            background: transparent;
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
        }

        .forgot-button:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            margin: 20px 0;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .google-button {
            width: 100%;
            padding: 13px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .google-button:hover {
            background: #f5f5f5;
        }

        .google-letter {
            color: #4285F4;
            font-size: 21px;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #message:empty {
            display: none;
        }

        .signup-text {
            margin-top: 25px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .signup-text a,
        .back-home {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover,
        .back-home:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--white);
            font-size: 13px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            header {
                justify-content: center;
            }
        }

        @media (max-width: 500px) {
            header {
                padding: 20px 12px;
            }

            nav a {
                font-size: 12px;
                padding: 8px;
            }

            .login-section {
                padding: 30px 15px;
            }

            .login-box {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="./index.html" class="logo">Sophie</a>

    <nav>
       <a href="index.html">Home</a>
             <a href="about.html">About</a>
            <a href="service.html">Services</a>
            <a href="skill.html">Skills</a>
            <a href="education.html">Education</a>
            <a href="Project.html">Projects</a>
            <a href="Blog.html">Blog</a>
            <a href="contact.html">Contact</a>
            <a href="Login.html">Login</a>
    </nav>
</header>

<main class="login-section">
    <div class="login-box">

        <div class="login-icon">
            <img src="./sophie.pic-removebg-preview.png"
                 alt="Sophie">
        </div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your Sophie account</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>

                    <button type="button"
                            id="togglePassword"
                            class="toggle-password">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit"
                    id="loginButton"
                    class="login-button">
                LOGIN
            </button>

        </form>

        <button type="button"
                id="forgotPassword"
                class="forgot-button">
            Forgot Password?
        </button>

        <div class="divider">OR</div>

        <button type="button"
                id="googleLogin"
                class="google-button">
            <span class="google-letter">G</span>
            Continue with Google
        </button>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="signup-text">
            Don't have an account?
            <a href="./sign up.html">Sign Up</a>
        </p>

        <a href="./index.html" class="back-home">
            ← Back to Home
        </a>

    </div>
</main>

<footer>
    <p>&copy; 2026 Sophie. All rights reserved.</p>
</footer>

<script type="module">
    import { initializeApp } from
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        GoogleAuthProvider,
        signInWithPopup
    } from
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDo8Mx05x298OWpQaDUAjUvYR2Ye-ELcUs",
        authDomain: "dashboard-35801.firebaseapp.com",
        projectId: "dashboard-35801",
        storageBucket: "dashboard-35801.firebasestorage.app",
        messagingSenderId: "605136367808",
        appId: "1:605136367808:web:fb1f5708c1ad8a3545bd25",
        measurementId: "G-W2W8LZLQ68"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const togglePassword = document.getElementById("togglePassword");
    const forgotPassword = document.getElementById("forgotPassword");
    const googleLogin = document.getElementById("googleLogin");
    const message = document.getElementById("message");

    function showMessage(text, color) {
        message.textContent = text;
        message.style.color = color;
    }

    togglePassword.addEventListener("click", () => {
        const hidden = passwordInput.type === "password";

        passwordInput.type = hidden ? "text" : "password";
        togglePassword.textContent = hidden ? "Hide" : "Show";
    });

    // EMAIL AND PASSWORD LOGIN
    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        loginButton.disabled = true;
        loginButton.textContent = "LOGGING IN...";
        showMessage("Checking your account...", "#555555");

        try {
            await signInWithEmailAndPassword(auth, email, password);

            showMessage("Login successful! Opening dashboard...", "green");
            window.location.assign("./dashboard.html");

        } catch (error) {
            console.error("Firebase login error:", error.code);

            const messages = {
                "auth/invalid-credential": "Incorrect email or password.",
                "auth/invalid-email": "Please enter a valid email address.",
                "auth/user-disabled": "This account has been disabled.",
                "auth/too-many-requests": "Too many attempts. Please try later.",
                "auth/network-request-failed": "Check your internet connection.",
                "auth/operation-not-allowed":
                    "Enable Email/Password in Firebase Authentication."
            };

            showMessage(
                messages[error.code] || "Login failed. Please try again.",
                "red"
            );

            loginButton.disabled = false;
            loginButton.textContent = "LOGIN";
        }
    });

    // FORGOT PASSWORD
    forgotPassword.addEventListener("click", async () => {
        const email = emailInput.value.trim();

        if (!email) {
            showMessage(
                "Enter your email address above first.",
                "red"
            );
            emailInput.focus();
            return;
        }

        forgotPassword.disabled = true;
        showMessage("Sending password reset email...", "#555555");

        try {
            await sendPasswordResetEmail(auth, email);

            showMessage(
                "If this email is registered, a password reset email has been sent. Check your inbox and spam folder.",
                "green"
            );

        } catch (error) {
            console.error("Password reset error:", error.code);

            const messages = {
                "auth/invalid-email": "Please enter a valid email address.",
                "auth/too-many-requests":
                    "Too many attempts. Please try again later.",
                "auth/network-request-failed":
                    "Check your internet connection."
            };

            showMessage(
                messages[error.code] ||
                "Unable to send reset email. Check your Firebase settings.",
                "red"
            );

        } finally {
            forgotPassword.disabled = false;
        }
    });

    // GOOGLE LOGIN
    googleLogin.addEventListener("click", async () => {
        googleLogin.disabled = true;
        googleLogin.textContent = "Connecting to Google...";

        try {
            await signInWithPopup(auth, googleProvider);

            showMessage("Google login successful!", "green");
            window.location.assign("./dashboard.html");

        } catch (error) {
            console.error("Google login error:", error.code);

            const messages = {
                "auth/popup-closed-by-user":
                    "Google login was cancelled. Please try again.",
                "auth/popup-blocked":
                    "Allow popups in your browser and try again.",
                "auth/unauthorized-domain":
                    "Add your website domain to Firebase Authorized domains.",
                "auth/operation-not-allowed":
                    "Enable Google sign-in in Firebase Authentication.",
                "auth/network-request-failed":
                    "Check your internet connection."
            };

            showMessage(
                messages[error.code] ||
                "Google login failed. Please try again.",
                "red"
            );

        } finally {
            googleLogin.disabled = false;
            googleLogin.innerHTML =
                '<span class="google-letter">G</span> Continue with Google';
        }
    });
</script>

</body>
</html>
