<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Skills</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #22174C;
            --secondary: #f5c518;
            --white: #ffffff;
            --text: #333333;
            --muted: #777777;
            --border: #dddddd;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: var(--primary);
        }

        .logo {
            color: var(--white);
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: var(--secondary);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            background: var(--secondary);
            color: var(--primary);
        }


header h2 {
    color: #ffffff;
    margin: 0;
}
        

        .skills {
            text-align: center;
            padding: 60px 20px;
        }

        .skills h1 {
            color: white;
            font-size: 35px;
            margin-bottom: 50px;
        }

        .skills h1 span {
            color: yellow;
        }

    

        .skill-container {
            width: 600px;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
        }

    

        .card {
            width: 150px;
            text-align: center;
        }


        .icon {
            font-size: 55px;
            color: white;
            margin-bottom: 15px;
        }

    

        .card h2 {
            color: white;
            font-size: 20px;
        }

    </style>
</head>


<body>



    <header>

        <div class="logo">
            Sophie
        </div>

        <nav>
            <a href="./index.html">Home</a>
            <a href="./Abouts.html">About</a>
            <a href="./service.html">Services</a>
            <a href="./skills.html">Skills</a>
            <a href="./Education.html">Education</a>
            <a href="./Project.html">Projects</a>
            <a href="./Blog.html">Blog</a>
            <a href="./contacts.html">Contact</a>
            <a href="./Login.html">Login</a>
        
        </nav>

    </header>



    <section class="skills">

        <h1>
            <span>My</span> Skills
        </h1>


        <div class="skill-container">



            <div class="card">
                <h2>HTML</h2>
                <div class="icon">
                    <i class="fa-brands fa-html5"></i>
                </div>

                
            </div>


    

            <div class="card">
                <h2>CSS</h2>
                <div class="icon">
                    <i class="fa-brands fa-css3-alt"></i>
                </div>

                
            </div>


        

            <div class="card">
                 <h2>JavaScript</h2>
                <div class="icon">
                    <i class="fa-brands fa-js"></i>
                </div>

               
            </div>


            <div class="card">
                <h2>Figma</h2>
                <div class="icon">
                    <i class="fa-brands fa-figma"></i>
                </div>

                
            </div>


            <div class="card">
                <h2>GitHub</h2>
                <div class="icon">
                    <i class="fa-brands fa-github"></i>
                </div>

                
            </div>


            <div class="card">
                <h2>React</h2>
                <div class="icon">
                    <i class="fa-brands fa-react"></i>
                </div>

                
            </div>

        </div>

    </section>

</body>

</html>
