<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
      * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #22174C;
            --secondary: #f5c518;
            --white: #ffffff;
            --text: #333333;
            --muted: #777777;
            --border: #dddddd;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: var(--primary);
        }

        .logo {
            color: var(--white);
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo span {
            color: var(--secondary);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            background: var(--secondary);
            color: var(--primary);
        }

.contact {
    padding: 80px 8%;
    background-color: #22174c;
    color: white;
}

.contact h2 {
    text-align: center;
    font-size: 35px;
    margin-bottom: 50px;
}

.contact h2 span {
    color: yellow;
}

.contact-container {
    display: flex;
    justify-content: space-between;
    gap: 50px;
}

.contact-info {
    width: 45%;
}

.contact-info h3 {
    font-size: 28px;
    margin-bottom: 20px;
}

.contact-info p {
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 15px;
}

form {
    width: 45%;
}

form input,
form textarea {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border: none;
    border-radius: 5px;
    outline: none;
    font-size: 15px;
}

form textarea {
    resize: none;
}

form button {
    padding: 12px 25px;
    background-color: yellow;
    color: #22174c;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

form button:hover {
    background-color: white;
}

    </style>
</head>
